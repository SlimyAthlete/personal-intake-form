<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Data Intake</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 720px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 6px;
    }
    button { margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 6px; cursor: pointer; }
    .status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Enter Details</h1>

  <form id="intakeForm" method="POST" action="https://script.google.com/macros/s/AKfycbygZJhYT3orXmvPULQegAPOQkl3EYvPcjJmaBNrqL1CDi5t2tX__0-PkWDRqj8_tCQmug/exec">
    <label for="name">Name (required)</label>
    <input id="name" name="name" required />

    <label for="platform">Platform</label>
    <input id="platform" name="platform" />

    <label for="location">Location</label>
    <input id="location" name="location" />

    <label for="into">Into</label>
    <input id="into" name="into" />

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="5"></textarea>

    <button type="submit">Submit</button>
    <div class="status" id="status"></div>
  </form>

</body>
</html>
