<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Data Intake</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 720px; }
    label { display:block; margin-top: 12px; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 6px;
    }
    button { margin-top: 16px; padding: 10px 14px; border: 0; border-radius: 6px; cursor: pointer; }
    .status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Enter Details</h1>

  <form id="intakeForm" method="POST" action="https://script.google.com/macros/s/AKfycbxwtBS1aHYuNHAxMzYliA9QMN_HDWTDP-BmCZFdbBWanA7Hx25KIWBtR9vYNkCR0BsnfA/exec">
    <label for="name">Name (required)</label>
    <input id="name" name="name" required />

    <label for="platform">Platform</label>
    <input id="platform" name="platform" placeholder="e.g., LinkedIn, Discord, Email" />

    <label for="location">Location</label>
    <input id="location" name="location" placeholder="e.g., Burlington, VT" />

    <label for="into">Into</label>
    <input id="into" name="into" placeholder="e.g., SD-WAN, hiking, AI" />

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="5"></textarea>

    <button type="submit">Submit</button>
    <div class="status" id="status"></div>
  </form>
  <iframe name="hidden_iframe" style="display:none;"></iframe>
<script>
  // Paste your /exec URL here
  const API_URL = "https://script.google.com/macros/s/AKfycbxwtBS1aHYuNHAxMzYliA9QMN_HDWTDP-BmCZFdbBWanA7Hx25KIWBtR9vYNkCR0BsnfA/exec";

  const form = document.getElementById("intakeForm");
  const statusEl = document.getElementById("status");

  // Configure the form to POST into the hidden iframe (avoids CORS)
  form.setAttribute("method", "POST");
  form.setAttribute("action", API_URL);
  form.setAttribute("target", "hidden_iframe");

  form.addEventListener("submit", () => {
    statusEl.textContent = "Submitting...";

    // Because we cannot read the cross-origin response, we optimistically confirm.
    setTimeout(() => {
      statusEl.textContent = "Saved to Google Sheets.";
      form.reset();
    }, 800);
  });
</script>
</body>
</html>
